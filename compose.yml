services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agent_review
      MYSQL_USER: agent_review
      MYSQL_PASSWORD: agent_review
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: &app-environment
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://agent_review:agent_review@mysql:3306/agent_review
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REVIEW_WORKER_MAX_RETRIES: ${REVIEW_WORKER_MAX_RETRIES:-3}
      REVIEW_RETRY_BASE_SECONDS: ${REVIEW_RETRY_BASE_SECONDS:-5}
      REVIEW_RETRY_MAX_SECONDS: ${REVIEW_RETRY_MAX_SECONDS:-300}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-development-webhook-secret}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-secrets/github-app-private-key.pem}
      GITHUB_REVIEW_BODY_MAX_CHARACTERS: ${GITHUB_REVIEW_BODY_MAX_CHARACTERS:-60000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
    command:
      [
        "sh",
        "-c",
        "python scripts/wait_for_database.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    environment: *app-environment
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  mysql_data:
