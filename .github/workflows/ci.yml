name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  LLM_PROVIDER: mock
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check committed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          else
            git show --check --format= --root "$HEAD_SHA"
          fi

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy app evals scripts/llm_fault_stub.py

      - name: Run test suite
        run: python -m pytest

  mysql-migrations:
    name: MySQL migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql+pymysql://agent_review:ci_password@127.0.0.1:3306/agent_review_ci

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agent_review_ci
          MYSQL_USER: agent_review
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install production dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Wait for MySQL
        run: python scripts/wait_for_database.py

      - name: Upgrade an empty database to head
        run: python -m alembic upgrade head

      - name: Verify the database is at every head
        run: python -m alembic current --check-heads

      - name: Verify downgrade and clean re-upgrade
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current --check-heads
