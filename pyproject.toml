[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-review"
version = "0.1.0"
description = "Multi-agent pull request review platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymysql>=1.1,<2",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-mock>=3.14,<4",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["integration: tests that require infrastructure"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
